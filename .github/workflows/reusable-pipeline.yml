name: Jive Reusable CI/CD Pipeline

on:
  workflow_call: {}

env:
  JIVE_CICD_INPUT: >-
    {"environment":null,"context":{"provider":"github","data":${{ toJSON(github) }}}}

jobs:
  config:
    name: Load CI/CD Config
    # Fixed runner: nothing is known about the caller's desired runner yet, since that's exactly
    # what this job's job is to determine (it lives in the caller's own package.json, so it can
    # only be read once the caller's repo is checked out).
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.load.outputs.runs-on }}
      deploy-verb: ${{ steps.load.outputs.deploy-verb }}
      deploy-branches: ${{ steps.load.outputs.deploy-branches }}
      run-on-pull-requests: ${{ steps.load.outputs.run-on-pull-requests }}
      enable-preview-deploys: ${{ steps.load.outputs.enable-preview-deploys }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Load CI/CD Config
        id: load
        uses: jive-sh/jive/.github/actions/load-cicd-config@main

  build:
    name: Build & Unit Test
    needs: config
    if: >-
      (needs.config.outputs.run-on-pull-requests == 'true' && github.event_name == 'pull_request')
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && fromJSON(needs.config.outputs.deploy-branches)[github.ref_name] != null)
    runs-on: ${{ fromJSON(needs.config.outputs.runs-on) }}
    # For publishing
    permissions:
      # commenting contents out to prove that it's needed for checkout step
      # contents: read
      id-token: write
    outputs:
      environments: ${{ steps.sequence-deploys.outputs.environments }}
      will-deploy: ${{ steps.sequence-deploys.outputs['will-deploy'] }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Secrets
        uses: jive-sh/jive/.github/actions/setup-secrets@main
        with:
          secrets: ${{ toJSON(secrets) }}
      - name: Install Dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: bun run jive:cicd:build
      - name: Audit
        shell: bash
        run: bun run jive:cicd:audit
      - name: Sequence Deploys
        id: sequence-deploys
        uses: jive-sh/jive/.github/actions/sequence-deploys@main
        with:
          enable-preview-deploys: ${{ needs.config.outputs.enable-preview-deploys }}
          deploy-environments: ${{ toJSON(fromJSON(needs.config.outputs.deploy-branches)[github.ref_name]) }}
      - name: Upload Artifacts
        id: upload-artifacts
        uses: jive-sh/jive/.github/actions/upload-artifacts@main
        with:
          will-deploy: ${{ steps.sequence-deploys.outputs['will-deploy'] }}

  deploy:
    name: ${{ needs.config.outputs.deploy-verb }} ${{ matrix.environment.name }}
    needs: [config, build]
    if: ${{ needs.build.outputs['will-deploy'] == 'true' }}
    runs-on: ${{ fromJSON(needs.config.outputs.runs-on) }}
    environment:
      name: deploy
      url: ${{ matrix.environment.url }}
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.build.outputs.environments) }}
    steps:
      # TODO: In the future, use Jive-controlled runner with persistent state per workflow
      #       such that there is no need to upload or download artifacts.
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Secrets
        uses: jive-sh/jive/.github/actions/setup-secrets@main
        with:
          secrets: ${{ toJSON(secrets) }}
      - name: Deploy
        shell: bash
        env:
          JIVE_CICD_INPUT: >-
            {"environment":${{ toJSON(matrix.environment.name) }},"context":{"provider":"github","data":${{ toJSON(github) }}}}
        run: bun run jive:cicd:deploy
