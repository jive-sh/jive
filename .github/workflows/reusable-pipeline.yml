name: Jive Reusable CI/CD Pipeline

on:
  workflow_call:
    secrets:
      # `secrets: inherit` passes a caller's secrets only when the caller is in the same organization or enterprise as
      # this workflow; otherwise a reusable workflow receives only the secrets it declares by name
      # (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows). So a caller in another
      # organization passes all of its secrets as one, `SECRETS: ${{ toJSON(secrets) }}`, and a caller here keeps
      # `secrets: inherit`, which leaves this empty.
      SECRETS:
        required: false

jobs:
  context:
    name: Load Context
    # Fixed runner: nothing is known about the caller's desired runner yet, since that's exactly
    # what this job's job is to determine (it lives in the caller's own package.json, so it can
    # only be read once the caller's repo is checked out).
    runs-on: ubuntu-latest
    outputs:
      pipeline-context: ${{ steps.load.outputs.pipeline-context }}
      package-config: ${{ steps.load.outputs.package-config }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Load Context
        id: load
        uses: jive-sh/jive/.github/actions/load-context@main

  build:
    name: Build & Unit Test
    needs: context
    if: >-
      (fromJSON(needs.context.outputs.package-config).cicd.runsOnPullRequests && github.event_name == 'pull_request')
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && fromJSON(needs.context.outputs.package-config).cicd.deploy.branches[github.ref_name] != null)
    runs-on: ${{ fromJSON(needs.context.outputs.package-config).cicd.runsOn }}
    # Base64, decoded by the read-deploy-plan job: see the Encode Outputs step.
    outputs:
      environments-base64: ${{ steps.encode-outputs.outputs.environments }}
      will-deploy-base64: ${{ steps.encode-outputs.outputs['will-deploy'] }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Secrets
        uses: jive-sh/jive/.github/actions/setup-secrets@main
        with:
          secrets: ${{ secrets.SECRETS || toJSON(secrets) }}
      - name: Install Dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: bun run jive:cicd:build
      - name: Audit
        shell: bash
        run: bun run jive:cicd:audit
      - name: Sequence Deploys
        id: sequence-deploys
        uses: jive-sh/jive/.github/actions/sequence-deploys@main
        with:
          branch: ${{ github.ref_name }}
          previews: ${{ fromJSON(needs.context.outputs.package-config).cicd.deploy.previews }}
          deploy-environments: ${{ toJSON(fromJSON(needs.context.outputs.package-config).cicd.deploy.branches[github.ref_name]) }}
          pipeline-context: ${{ needs.context.outputs.pipeline-context }}
          sequential-deployments: ${{ fromJSON(needs.context.outputs.package-config).cicd.deploy.sequentially }}
      - name: Upload Artifacts
        id: upload-artifacts
        uses: jive-sh/jive/.github/actions/upload-artifacts@main
        with:
          will-deploy: ${{ steps.sequence-deploys.outputs['will-deploy'] }}
          pipeline-context: ${{ needs.context.outputs.pipeline-context }}
      # GitHub masks a multi-line secret line by line, so SECRETS (a caller's secrets as pretty-printed JSON) makes its
      # lone "{" and "}" lines masks in this job, and the runner drops every job output containing either: "Skip output
      # 'environments' since it may contain secret" (https://github.com/open-empires/decomp-project-image/actions/runs/44003290745),
      # after which no deploy job starts. Base64 has neither character. Expressions can't decode base64, so the
      # read-deploy-plan job, which reads no secrets and so has no masks, decodes these for the deploy job.
      - name: Encode Outputs
        id: encode-outputs
        shell: bash
        env:
          ENVIRONMENTS: ${{ steps.sequence-deploys.outputs.environments }}
          WILL_DEPLOY: ${{ steps.sequence-deploys.outputs['will-deploy'] }}
        run: |
          echo "environments=$(printf '%s' "$ENVIRONMENTS" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "will-deploy=$(printf '%s' "$WILL_DEPLOY" | base64 -w0)" >> "$GITHUB_OUTPUT"

  read-deploy-plan:
    name: Read Deploy Plan
    needs: build
    # Fixed runner: this only decodes two strings.
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.decode-outputs.outputs.environments }}
      will-deploy: ${{ steps.decode-outputs.outputs['will-deploy'] }}
    steps:
      - name: Decode Outputs
        id: decode-outputs
        shell: bash
        env:
          ENVIRONMENTS: ${{ needs.build.outputs.environments-base64 }}
          WILL_DEPLOY: ${{ needs.build.outputs.will-deploy-base64 }}
        run: |
          echo "environments=$(printf '%s' "$ENVIRONMENTS" | base64 -d)" >> "$GITHUB_OUTPUT"
          echo "will-deploy=$(printf '%s' "$WILL_DEPLOY" | base64 -d)" >> "$GITHUB_OUTPUT"

  # Long-term TODOS:
  # 1. Branch allow list should probably be auto-set in GHA based on the package config
  # 2. There should be an ability to set approval steps before a deployment
  deploy:
    name: ${{ fromJSON(needs.context.outputs.package-config).cicd.deploy.verb }} ${{ matrix.environment.name }}
    needs: [context, build, read-deploy-plan]
    if: ${{ needs.read-deploy-plan.outputs['will-deploy'] == 'true' }}
    runs-on: ${{ fromJSON(needs.context.outputs.package-config).cicd.runsOn }}
    environment:
      name: ${{ matrix.environment.name }}
      url: ${{ matrix.environment.url }}
    # ID token identifies the pipeline running the script. Jive and NPM both recognize these tokens to allow access to resources
    permissions:
      contents: read
      id-token: write
    strategy:
      # 256 is how we express "no limit": an expression can't omit the key, and a matrix holds at
      # most 256 jobs, so this matches leaving max-parallel unset. Actual concurrency is still
      # capped by runner availability and the plan's concurrent-job limit.
      max-parallel: ${{ fromJSON(needs.context.outputs.package-config).cicd.deploy.sequentially && 1 || 256 }}
      matrix:
        environment: ${{ fromJSON(needs.read-deploy-plan.outputs.environments) }}
    steps:
      # TODO: In the future, use Jive-controlled runner with persistent state per workflow
      #       such that there is no need to upload or download artifacts.
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      # The artifact carries build output only, so the dependencies the deploy hook needs — including
      # the template's own CLI — are reinstalled here rather than shipped through the artifact.
      - name: Install Dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Setup Secrets
        uses: jive-sh/jive/.github/actions/setup-secrets@main
        with:
          secrets: ${{ secrets.SECRETS || toJSON(secrets) }}
      - name: Deploy
        shell: bash
        env:
          JIVE_DEPLOY_ENVIRONMENT: ${{ matrix.environment.name }}
          JIVE_PIPELINE_CONTEXT: ${{ needs.context.outputs.pipeline-context }}
        run: bun run jive:cicd:deploy
