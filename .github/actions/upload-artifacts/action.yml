name: Jive Upload Artifacts
description: Runs the package's jive:cicd:upload-artifacts script and, if there will be a deploy, uploads the working directory as a workflow artifact.

inputs:
  will-deploy:
    description: Whether one or more environments will be deployed to after the build job
    required: true
  pipeline-context:
    description: JSON describing this run, passed to the hook as JIVE_PIPELINE_CONTEXT.
    required: true

runs:
  using: composite
  steps:
    - name: Upload Artifacts Script
      shell: bash
      env:
        JIVE_PIPELINE_CONTEXT: ${{ inputs['pipeline-context'] }}
      run: bun run jive:cicd:upload-artifacts
    - name: Upload Artifacts
      if: ${{ inputs['will-deploy'] == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        # node_modules is excluded and reinstalled by the deploy job instead: an artifact does not
        # preserve file modes or symlinks, so an installed tree arrives unusable, and it is by far
        # the largest thing here.
        path: |
          .
          !node_modules
          !node_modules/**
        # Build output is sometimes a hidden directory (.next, .output), which is skipped by default.
        include-hidden-files: true
