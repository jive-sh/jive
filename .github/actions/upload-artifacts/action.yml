name: Jive Upload Artifacts
description: Runs the package's jive:cicd:upload-artifacts script and, if there will be a deploy, uploads the working directory as a workflow artifact.

inputs:
  will-deploy:
    description: Whether one or more environments will be deployed to after the build job
    required: true
  pipeline-context:
    description: JSON describing this run, passed to the hook as JIVE_PIPELINE_CONTEXT.
    required: true

runs:
  using: composite
  steps:
    - name: Upload Artifacts Script
      shell: bash
      env:
        JIVE_PIPELINE_CONTEXT: ${{ inputs['pipeline-context'] }}
      run: bun run jive:cicd:upload-artifacts
    - name: Upload Artifacts
      if: ${{ inputs['will-deploy'] == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: .
