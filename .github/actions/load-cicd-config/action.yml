name: Jive Load CI/CD Config
description: Runs the package's jive:cicd:get-config script and fans the resolved jive.cicd config out into individual outputs.

outputs:
  runs-on:
    description: JSON-encoded runs-on value (string, string array, or {group, labels} object).
    value: ${{ steps.load.outputs['runs-on'] }}
  deploy-verb:
    description: What the deploy pipeline step should display, e.g. "Deploy to".
    value: ${{ steps.load.outputs['deploy-verb'] }}
  deploy-branches:
    description: JSON object mapping each deployable branch to its ordered list of environments.
    value: ${{ steps.load.outputs['deploy-branches'] }}
  run-on-pull-requests:
    description: "true if pull requests should run the build & unit-test pipeline."
    value: ${{ steps.load.outputs['run-on-pull-requests'] }}
  enable-preview-deploys:
    description: "true if non-deploy-branch workflow_dispatch/PR runs should deploy a Preview environment."
    value: ${{ steps.load.outputs['enable-preview-deploys'] }}

runs:
  using: composite
  steps:
    - name: Load CI/CD Config
      id: load
      shell: bash
      env:
        JIVE_CICD_INPUT: >-
          {"environment":null,"context":{"provider":"github","data":${{ toJSON(github) }}}}
      run: |
        CONFIG_JSON="$(bun run jive:cicd:get-config)"
        export CONFIG_JSON
        bun run - <<'BUN' >> "$GITHUB_OUTPUT"
          const config = JSON.parse(process.env.CONFIG_JSON);
          console.log(`runs-on=${JSON.stringify(config.runsOn)}`);
          console.log(`deploy-verb=${config.deployVerb}`);
          console.log(`deploy-branches=${JSON.stringify(config.deployBranches)}`);
          console.log(`run-on-pull-requests=${config.runOnPullRequests}`);
          console.log(`enable-preview-deploys=${config.enablePreviewDeploys}`);
        BUN
