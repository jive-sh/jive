name: Jive Sequence Deploys
description: >-
  Resolves the ordered list of environments this run deploys to: the ones its branch selects, minus those whose
  jive:cicd:deploy:plan hook reports nothing to deploy.

inputs:
  branch:
    description: Name of the git branch the pipeline is running on.
    required: true
  deploy-environments:
    description: >-
      JSON array of environments to deploy to, in order (e.g. ["Staging","Production"]),
      already resolved for the current branch, or "null" if the branch has no entry in deploy.branches.
      Ignored on PR runs.
    required: true
  pipeline-context:
    description: JSON describing this run, passed to the jive:cicd:deploy:plan hook as JIVE_PIPELINE_CONTEXT.
    required: true
  previews:
    description: >-
      If true, a pull-request run (or a "null" deploy-environments, e.g. workflow_dispatch on a branch not in
      deploy.branches) resolves to a "Preview" environment. If false, those cases resolve to no deploy at all.
    required: true
  sequential-deployments:
    description: >-
      Whether deployments are sequential (one env must finish deploying before the next)
      or parallel (all envs deployed at the same time).
    required: true

outputs:
  environments:
    description: >-
      JSON array of {name, url} for each environment with something to deploy, in order, including Preview when
      enabled.
    value: ${{ steps.sequence-deploys.outputs.environments }}
  will-deploy:
    description: "true if at least one environment has something to deploy; when false the deploy job is skipped."
    value: ${{ steps.sequence-deploys.outputs['will-deploy'] }}

runs:
  using: composite
  steps:
    # The script validates each plan with Effect's Schema, so this action installs its own pinned copy
    # rather than relying on whatever the package being built depends on.
    - name: Install Sequence Deploys Dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production
    - name: Sequence Deploys
      id: sequence-deploys
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        DEPLOY_ENVIRONMENTS: ${{ inputs.deploy-environments }}
        PREVIEWS: ${{ inputs.previews }}
        IS_PR: ${{ github.event_name == 'pull_request' }}
        PIPELINE_CONTEXT: ${{ inputs['pipeline-context'] }}
        SEQUENTIAL_DEPLOYMENTS: ${{ inputs['sequential-deployments'] }}
      run: bun "$GITHUB_ACTION_PATH/sequence-deploys.ts" >> "$GITHUB_OUTPUT"
